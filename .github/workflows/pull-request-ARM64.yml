name: Compile PRoot Static (ARM64)

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-static-arm64:
    name: "Build ARM64 Static Binary"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        
      - name: Build static PRoot in ARM64 Alpine
        # 修复 1: git config 添加安全目录白名单
        # 修复 2: sed 动态向 cli.c 顶部注入 <libgen.h> 头文件
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace alpine:latest sh -c "\
            apk update && \
            apk add git make gcc musl-dev linux-headers pkgconf talloc-dev talloc-static bsd-compat-headers && \
            git config --global --add safe.directory /workspace && \
            sed -i '1i#include <libgen.h>' src/cli/cli.c && \
            make -C src clean proot LDFLAGS='-static' && \
            mv src/proot /workspace/proot-aarch64-static \
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-aarch64-static
          path: proot-aarch64-static

      - name: Auto Release to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-arm64
          name: PRoot Latest (ARM64 Static)
          files: proot-aarch64-static
          draft: false
          prerelease: false
