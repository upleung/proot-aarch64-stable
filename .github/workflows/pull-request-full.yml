name: Compile PRoot Static (Multi-Arch)

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-static:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 即使某个架构失败，也不中断其他架构的编译
      matrix:
        # 定义需要编译的三种架构及其对应的 Docker 平台环境
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: arm
            platform: linux/arm/v7
          - arch: x86_64
            platform: linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for Cross-Compilation
        uses: docker/setup-qemu-action@v3

      - name: Build static PRoot in Alpine (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v ${{ github.workspace }}:/workspace -w /workspace alpine:latest sh -c "\
            apk update && \
            apk add git make gcc musl-dev linux-headers pkgconf talloc-dev talloc-static bsd-compat-headers && \
            git config --global --add safe.directory /workspace && \
            sed -i '1i#include <libgen.h>' src/cli/cli.c && \
            sed -i '1i#include \"tracee/mem.h\"' src/tracee/tracee.c && \
            make -C src clean proot HAS_TALLOC=1 LDFLAGS='-static -ltalloc' CFLAGS='-I/usr/include' && \
            mv src/proot /workspace/proot-v5.4.0-${{ matrix.arch }}-static \
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-v5.4.0-${{ matrix.arch }}-static
          path: proot-v5.4.0-${{ matrix.arch }}-static

  # 在所有架构都编译完成后，打包发布 Release
  release:
    name: Auto Release to GitHub
    needs: build-static # 等待 build-static 矩阵里的三个任务全部完成
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 将下载的文件合并到同一个目录中

      - name: Create Multi-Arch Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.0-build
          name: PRoot v5.4.0 (Multi-Arch Static)
          files: artifacts/*
          draft: false
          prerelease: false
